<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Start Presentation Timer</title>
  <style>
    :root{color-scheme:dark light}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:Arial,Helvetica,sans-serif;
      background:#17191d;
      color:#f5f7fa;
    }
    main{
      width:min(680px,calc(100% - 32px));
      text-align:center;
    }
    h1{font-size:clamp(2rem,6vw,4rem);margin:0 0 12px}
    p{color:#b9c0ca;line-height:1.6}
    a{
      display:block;
      margin:28px auto 18px;
      padding:18px 24px;
      max-width:440px;
      border:1px solid #6d7683;
      border-radius:8px;
      color:#fff;
      text-decoration:none;
      font-size:1.3rem;
      font-weight:700;
      background:#252932;
    }
    a:hover{background:#303641}
    .small{font-size:.95rem}
    code{background:#242831;padding:2px 6px;border-radius:4px}
  </style>
</head>
<body>
  <main>
    <h1>Presentation Timer</h1>
    <p>Click the button below to start the timer.</p>
    <a href="index.html">Open Presentation Timer</a>
    <p class="small">
      Windows: you can also double-click <code>START Presentation Timer.bat</code>.<br>
      macOS / Linux: open <code>index.html</code> in your browser.
    </p>
  </main>
</body>
</html>
