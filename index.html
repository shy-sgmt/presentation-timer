<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2b2b2b">
  <title>Presentation Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <main class="app-shell" id="appShell">
    <header class="topbar normal-ui">
      <button id="settingsToggle">Settings</button>
    </header>

    <section id="settingsPanel" class="settings-panel hidden normal-ui">
      <h2 id="generalHeading">General</h2>
      <div class="settings-content-grid">
        <div class="general-grid">
          <label><span id="themeLabel">Theme</span>
            <select id="themeSelect">
              <option value="light">Light</option><option value="dark" selected>Dark</option>
              <option value="high-contrast">High Contrast</option><option value="paper">Paper</option>
              <option value="matrix">Matrix</option><option value="tokyo-night">Tokyo Night</option>
              <option value="cyberpunk">Cyberpunk</option><option value="solarized">Solarized</option>
            </select>
          </label>
          <label><span id="languageLabel">Language</span>
            <select id="languageSelect"><option value="en">English</option><option value="ja">日本語</option></select>
          </label>
        <label><span id="timerSizeLabel">Timer Font Size (px)</span>
          <input id="timerSizeSelect" type="number" inputmode="numeric" min="72" max="320" step="4" value="300" aria-label="Timer Font Size in pixels">
        </label>
        </div>
        <div class="setting-actions general-actions">
          <button id="saveFile">Save Settings</button>
          <button id="loadFile">Load Settings</button>
          <input id="loadFileInput" type="file" accept="application/json,.json" hidden>
          <button id="restoreDefaults">Restore Defaults</button>
          <button id="clearData" class="danger-soft">Clear Local Data</button>
        </div>
      </div>
      <div id="saveStatus" class="status-line"></div>
    </section>

    <section class="template-switch-row normal-ui">
<nav id="mainTemplateButtons" class="template-bar" aria-label="Templates"></nav>
      <div class="template-actions" aria-label="Template actions">
        <span id="templateCount" class="template-count">3 / 10</span>
        <span id="editModeStatus" class="edit-mode-status hidden">Edit Mode · Changes are saved automatically</span>
        <button id="editToggle" class="primary template-edit-btn">Edit</button>
        <button id="addTemplate" class="template-manage-btn">＋ Add Template</button>
        <button id="duplicateTemplate" class="template-manage-btn">Duplicate</button>
        <button id="deleteTemplate" class="template-manage-btn danger-soft">Delete</button>
      </div>
      <div class="template-fullscreen-row">
        <button id="fullscreenBtn">Fullscreen</button>
      </div>
    </section>

    <section id="templateEditor" class="template-editor hidden normal-ui">
      <div class="template-editor-head">
        <div class="eyebrow" id="templateSettingsLabel">Template Settings</div>
      </div>
      <div class="template-settings-grid compact-settings">
        <label><span id="templateTitleLabel">Template title</span><input id="templateTitle" type="text"></label>
        <label><span id="snapLabel">Snap</span>
          <select id="snapSelect"><option value="60">1 min</option><option value="30" selected>30 sec</option><option value="10">10 sec</option><option value="1">1 sec</option></select>
        </label>
        <fieldset class="inline-choice">
          <legend id="countModeLabel">Count mode</legend>
          <label><input type="radio" name="countMode" value="down" checked><span>Count Down</span></label>
          <label><input type="radio" name="countMode" value="up"><span>Count Up</span></label>
        </fieldset>
        <label class="check-setting"><input id="timelineControl" type="checkbox"><span id="timelineControlLabel">Enable Timeline Control</span></label>
        <label class="check-setting"><input id="overtimeAlertEnabled" type="checkbox"><span id="overtimeAlertLabel">Overtime Alert (+3:00)</span></label>
        <label><span id="manualBellLabel">Manual Bell Count</span><input id="manualBellCount" type="number" min="1" max="8" value="4"></label>
        <label><span id="volumeText">Bell Volume</span> <span id="volumeLabel">100%</span><input id="bellVolume" type="range" min="0" max="100" value="100"></label>
      </div>
    </section>

    <section id="editorToolbar" class="toolbar hidden normal-ui">
      <span class="toolbar-label" id="toolLabel">Tool</span>
      <button class="tool active" data-tool="select" id="selectTool">Select</button>
      <button class="tool" data-tool="alert" id="alertTool">Alert Bell</button>
      <button class="tool" data-tool="event" id="eventTool">Event</button>
      <span class="toolbar-hint" id="toolbarHint">Click the bar to add. Grab a marker to move it.</span>
    </section>

    <div id="runtimeStage" class="runtime-stage">
    <section class="timeline-card persistent-ui">
      <div class="timeline-caption-row"><span id="startLabel">0:00</span><span id="endLabel">15:00</span></div>
      <div id="timeline" class="timeline">
        <div id="segments" class="segments"></div><div class="track-line"></div><div id="playhead" class="playhead"></div><div id="markerLayer" class="marker-layer"></div>
      </div>
      <div id="phaseLabels" class="phase-labels"></div>
    </section>

    <section class="timer-card persistent-ui" id="timerCard">
      <div id="activeTitle" class="active-title">Presentation</div>
      <div id="activeMessage" class="active-message">Presentation in progress</div>
      <div id="mainTime" class="main-time">10:00</div>
      <div id="nextInfo" class="next-info">Next: Q&amp;A at 10:00</div>
      <div class="runtime-controls">
        <div class="controls controls-primary">
          <button id="startPause" class="primary">Start</button>
          <button id="resetBtn">Reset</button>
          
        </div>
        <button id="ringBtn" class="ring-wide">Ring</button>
      </div>
    </section>

    </div>

    <section id="scheduleCard" class="table-card normal-ui hidden">
      <div class="section-title-row"><h2 id="scheduleHeading">Schedule</h2><span id="syncHint">Timeline and rows stay synchronized.</span></div>
      <div class="table-wrap"><table><thead><tr><th id="thTime">Time</th><th id="thType">Type</th><th id="thBell">Bell</th><th id="thTitle">Title</th><th id="thMessage">Message</th><th id="thActions">Actions</th></tr></thead><tbody id="scheduleBody"></tbody></table></div>
    </section>

    <div id="editBottomStage" class="edit-bottom-stage hidden normal-ui"></div>
  </main>
  <script src="app.js"></script>
</div>

</body>
</html>
