<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentation Timer</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #666666;
    --secondary: #555555;
    --control-bg: #f5f5f5;
    --stepper-bg: #f7f7f7;
    --hover-bg: #eaeaea;
    --border: #aaaaaa;
    --input-bg: #ffffff;
  }
  body.dark {
    --bg: #2b2b2b;
    --text: #ffffff;
    --muted: #bdbdbd;
    --secondary: #d0d0d0;
    --control-bg: #3a3a3a;
    --stepper-bg: #3a3a3a;
    --hover-bg: #4a4a4a;
    --border: #666666;
    --input-bg: #333333;
  }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .2s ease, color .2s ease;
  }
  .page {
    max-width: 1050px;
    margin: 0 auto;
    padding: 28px 24px 34px;
  }
  .settings-shell {
    width: min(860px, 96%);
    margin: 0 auto 10px;
  }
  .settings-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 36px;
    border-bottom: 1px solid var(--border);
  }
  .settings-toggle {
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    padding: 7px 12px;
  }
  .settings-toggle::after {
    content: ' ▾';
    display: inline-block;
    transition: transform .16s ease;
  }
  .settings-shell.open .settings-toggle::after { transform: rotate(180deg); }
  .settings-panel {
    display: none;
    padding-top: 10px;
  }
  .settings-shell.open .settings-panel { display: block; }
  .settings-groups {
    width: min(900px, 96%);
    margin: 0 auto 8px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    align-items: start;
  }
  .settings-group {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: color-mix(in srgb, var(--control-bg) 55%, transparent);
    overflow: hidden;
  }
  .settings-group > summary {
    list-style: none;
    cursor: pointer;
    padding: 9px 11px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    user-select: none;
  }
  .settings-group > summary::-webkit-details-marker { display: none; }
  .settings-group > summary::after { content: ' ▾'; display: inline-block; transition: transform .16s ease; }
  .settings-group[open] > summary::after { transform: rotate(180deg); }
  .settings-group-body {
    border-top: 1px solid var(--border);
    padding: 10px;
  }
  .basic-body .compact-options { margin-bottom: 8px; }
  .basic-body .settings-bottom-row { margin: 6px 0 0; gap: 16px; }
  .time-settings { grid-template-columns: 1fr; }
  .bell-group .bell-sidebar { border-left: 0; padding-left: 0; }
  .settings {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px 10px;
    margin: 0;
  }
  .setting { text-align: center; }
  .setting-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 5px; }
  .stepper button, .stepper input, .controls button { font: inherit; }
  .stepper button {
    width: 28px; height: 28px; border: 1px solid var(--border);
    background: var(--stepper-bg); color: var(--text); border-radius: 4px;
    font-size: 20px; cursor: pointer;
  }
  .stepper input {
    width: 54px; height: 28px; border: 1px solid var(--border);
    border-radius: 4px; background: var(--input-bg); color: var(--text);
    text-align: center; font-size: 16px;
  }
  .bell-sidebar {
    border-left: 1px solid var(--border);
    padding-left: 16px;
    min-width: 0;
  }
  .bell-sidebar-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    text-align: left;
  }
  .bell-sidebar .bell-counts {
    display: grid;
    grid-template-columns: 1fr;
    gap: 5px;
    margin: 0;
    justify-content: stretch;
  }
  .bell-sidebar .bell-counts strong { display: none; }
  .bell-sidebar .bell-counts label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  .controls button { font: inherit; }
  .compact-options {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    margin: 0 0 14px;
    font-size: 14px;
    color: var(--secondary);
  }
  .option-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .option-group strong { color: var(--text); }
  .option-group label { white-space: nowrap; }

  .settings-top-row {
    margin-bottom: 10px;
  }
  .settings-bottom-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
    margin: 8px 0 10px;
    font-size: 14px;
    color: var(--secondary);
  }
  .settings-bottom-row label { white-space: nowrap; }
  .timer-area {
    text-align: center;
  }
  .time-layout {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    margin-bottom: 10px;
  }
  .primary-panel {
    grid-column: 2;
    min-width: 0;
  }
  .secondary-panel {
    grid-column: 3;
    justify-self: end;
    text-align: left;
    min-width: 165px;
    padding-top: 20px;
    color: var(--secondary);
  }
  .secondary-label {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .secondary-display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(22px, 3.4vw, 42px);
    font-weight: 700;
    line-height: 1.1;
  }
  .timer-title {
    font-size: 31px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .time {
    font-variant-numeric: tabular-nums;
    font-size: clamp(112px, 21vw, 230px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.02em;
    margin: 0 0 22px;
  }
  .timeline-wrap {
    width: min(860px, 92%);
    margin: 8px auto 28px;
  }
  .timeline-labels { position: relative; height: 24px; font-size: 15px; font-weight: 700; color: var(--secondary); }
  .timeline-label { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .timeline-label.start { left: 0; transform: none; }
  .timeline-label.end { right: 0; left: auto; transform: none; }
  .timeline-bar { position: relative; display: flex; height: 18px; border: 2px solid var(--border); border-radius: 999px; overflow: visible; background: var(--control-bg); }
  .timeline-presentation { height: 100%; background: color-mix(in srgb, var(--text) 24%, transparent); border-radius: 999px 0 0 999px; }
  .timeline-qa { height: 100%; background: color-mix(in srgb, #b56a00 55%, transparent); border-radius: 0 999px 999px 0; }
  .timeline-progress { position: absolute; left: 0; top: -2px; height: 18px; border-radius: 999px; background: var(--text); opacity: .45; pointer-events: none; }
  .timeline-marker { position: absolute; top: 50%; width: 24px; height: 24px; border-radius: 50%; background: var(--text); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--text); transform: translate(-50%, -50%); pointer-events: none; touch-action: none; user-select: none; }
  .timeline-bar.timeline-editable { cursor: pointer; }
  .timeline-bar.timeline-editable .timeline-marker { pointer-events: auto; cursor: grab; width: 28px; height: 28px; }
  .timeline-bar.timeline-editable .timeline-marker:active { cursor: grabbing; }
  .timeline-control-toggle {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    font-size: 13px;
    color: var(--secondary);
  }
  .timeline-control-toggle label { cursor: pointer; white-space: nowrap; }
  .timeline-control-toggle input { vertical-align: middle; }

  .timeline-bell { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: 2px solid var(--bg); box-shadow: 0 0 0 2px var(--text); transform: translate(-50%, -50%); pointer-events: none; z-index: 4; }
  .sound-toggle {
    margin: 0 auto 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px 14px;
    flex-wrap: wrap;
    color: var(--secondary);
    font-size: 13px;
  }
  .sound-toggle strong { color: var(--text); font-size: 13px; }
  .sound-toggle label { white-space: nowrap; cursor: pointer; }
  .bell-counts label { display: flex; align-items: center; gap: 6px; cursor: default; }
  .bell-counts input {
    width: 54px;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--input-bg);
    color: var(--text);
    text-align: center;
    font: inherit;
  }
  .bell-counts input:disabled { opacity: .45; cursor: not-allowed; }
  .timeline-qa-inside { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 12px; font-weight: 700; color: #5a3400; white-space: nowrap; pointer-events: none; z-index: 3; }
  .timeline-phase { display: flex; justify-content: center; gap: 34px; margin-top: 14px; font-size: 20px; font-weight: 700; }
  .timeline-phase .inactive { opacity: .35; }

  .controls-wrap {
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: nowrap;
  }
  .controls button {
    min-width: 118px;
    padding: 12px 18px;
    border: 1px solid var(--border);
    background: var(--control-bg);
    color: var(--text);
    border-radius: 5px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  .manual-ring-btn {
    width: 100%;
    margin-top: 8px;
    padding: 7px 18px;
    border: 1px solid var(--border);
    background: var(--control-bg);
    color: var(--text);
    border-radius: 5px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .controls button:hover,
  .manual-ring-btn:hover,
  .stepper button:hover { background: var(--hover-bg); }
  .footer {
    text-align: center;
    margin-top: 44px;
    color: var(--muted);
    font-size: 14px;
  }
  .overtime { color: #c40000; }
  .qa-title { color: #b56a00; }
  .ending-soon {
    animation: endingPulse .8s ease-in-out infinite alternate;
  }
  @keyframes endingPulse {
    from { opacity: 1; transform: scale(1); }
    to { opacity: .55; transform: scale(1.025); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ending-soon { animation: none; text-decoration: underline; text-decoration-thickness: 4px; }
  }

  body.fullscreen .page {
    max-width: none;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2vh 4vw;
  }
  body.fullscreen .settings-shell,
  body.fullscreen .footer { display: none; }
  body.fullscreen .time { font-size: min(31vw, 340px); }
  body.fullscreen .timer-title { font-size: min(4.4vw, 58px); }
  body.fullscreen .secondary-panel {
    min-width: 220px;
    padding-top: 2.7vh;
  }
  body.fullscreen .secondary-label { font-size: min(2vw, 26px); }
  body.fullscreen .secondary-display { font-size: min(4vw, 54px); }
  body.fullscreen .timeline-wrap { width: min(980px, 86%); margin-bottom: 3vh; }
  body.fullscreen .timeline-labels { font-size: min(1.8vw, 24px); height: min(2.2vw, 30px); }
  body.fullscreen .timeline-qa-inside { font-size: min(1.2vw, 16px); }
  body.fullscreen .timeline-bell { width: 18px; height: 18px; }
  body.fullscreen .timeline-phase { font-size: min(2.4vw, 30px); }

  @media (max-width: 700px) {
    .settings-groups { grid-template-columns: 1fr; gap: 8px; }
    .bell-sidebar { border-left: 0; padding-left: 0; }
    .bell-sidebar .bell-counts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .settings { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .setting-inline { font-size: 12px; gap: 6px; }
    .setting-inline input { width: 54px; height: 30px; font-size: 16px; }
    .compact-options { gap: 12px; margin-bottom: 10px; font-size: 13px; }
    .time-layout {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .primary-panel,
    .secondary-panel { grid-column: 1; justify-self: center; text-align: center; }
    .secondary-panel {
      min-width: 0;
      padding-top: 0;
      margin-top: -10px;
      margin-bottom: 12px;
    }
    .time { font-size: 25vw; }
    .timeline-wrap { width: 96%; }
    .controls-wrap { width: 100%; }
    .controls { gap: 8px; }
    .controls button { min-width: 0; flex: 1 1 0; padding: 11px 10px; font-size: 15px; }
  }

  .settings-section-title { white-space: nowrap !important; min-width: max-content; }
  .settings-section-header { cursor: default !important; }
  .settings-section-toggle { display: none !important; }
  .settings-section-content { display: block !important; }


  /* v21: keep the middle Time Settings section stable and wide enough */
  .settings-sections {
    display: grid !important;
    grid-template-columns: minmax(190px, 0.9fr) minmax(430px, 1.8fr) minmax(210px, 1fr) !important;
    gap: 14px !important;
    align-items: start !important;
  }
  .settings-section { min-width: 0; }
  .settings-section.time-settings { min-width: 430px; }
  .settings-section.time-settings .section-title,
  .settings-section.time-settings .settings-section-title {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
  }
  .settings-section.time-settings .settings,
  .settings-section.time-settings .time-settings-grid {
    grid-template-columns: repeat(4, minmax(92px, 1fr)) !important;
    gap: 8px !important;
  }
  .settings-section.time-settings .setting-title {
    white-space: nowrap !important;
    font-size: 12px !important;
  }
  @media (max-width: 900px) {
    .settings-sections { grid-template-columns: 1fr !important; }
    .settings-section.time-settings { min-width: 0; }
  }


  /* v21b: balanced three-column settings; wider Time Settings */
  .settings-groups {
    width: min(1040px, 98%) !important;
    grid-template-columns: minmax(220px, 0.9fr) minmax(500px, 1.9fr) minmax(220px, 0.9fr) !important;
    gap: 12px !important;
  }
  .settings-group { min-width: 0; }
  .settings-group:nth-child(2) > summary {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow-wrap: normal !important;
  }
  .settings-group:nth-child(2) .time-settings {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px 12px !important;
  }
  .settings-group:nth-child(2) .setting-title {
    white-space: nowrap !important;
    font-size: 12px !important;
  }
  @media (max-width: 900px) {
    .settings-groups { grid-template-columns: 1fr !important; width: min(760px, 98%) !important; }
  }


  .settings-group-heading {
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    white-space: nowrap;
    margin: 0 0 10px;
    color: var(--text);
  }

  /* v23: center the three settings groups and remove the right-heavy layout */
  .settings-shell {
    width: min(1000px, 100%) !important;
  }
  .settings-panel {
    width: 100%;
  }
  .settings-groups {
    width: 100% !important;
    margin: 0 auto 8px !important;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr) !important;
    gap: 12px !important;
  }
  .settings-group:nth-child(2) .time-settings {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px 12px !important;
  }
  .settings-group-heading {
    padding-top: 10px;
  }
  @media (max-width: 900px) {
    .settings-shell { width: min(760px, 100%) !important; }
    .settings-groups { grid-template-columns: 1fr !important; width: 100% !important; }
  }


  /* v24 bilingual controls */
  .basic-body .settings-top-row { flex-wrap: wrap; row-gap: 8px; }
  .settings-group-heading { white-space: nowrap; }
  @media (max-width: 900px) {
    .basic-body .settings-top-row { justify-content: center; }
  }


  .clear-settings-row {
    display: flex;
    justify-content: center;
    margin-top: 8px;
  }
  .clear-settings-btn {
    font: inherit;
    padding: 7px 16px;
    border: 1px solid var(--border);
    background: var(--control-bg);
    color: var(--text);
    border-radius: 5px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .clear-settings-btn:hover { background: var(--hover-bg); }

</style>
</head>
<body>
<div class="page">
  <div id="settingsShell" class="settings-shell">
    <div class="settings-bar">
      <button id="settingsToggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="settingsPanel">Settings</button>
    </div>

    <div id="settingsPanel" class="settings-panel">
      <div class="settings-groups">
        <div class="settings-group">
          <div class="settings-group-heading">Basic</div>
          <div class="settings-group-body basic-body">
            <div class="compact-options settings-top-row">
              <div class="option-group">
                <strong id="countLabel">Count:</strong>
                <label><input type="radio" name="countMode" value="down" checked> <span id="countDownLabel">Down</span></label>
                <label><input type="radio" name="countMode" value="up"> <span id="countUpLabel">Up</span></label>
              </div>
              <div class="option-group">
                <strong id="themeLabel">Theme:</strong>
                <label><input type="radio" name="themeMode" value="light"> <span id="lightLabel">Light</span></label>
                <label><input type="radio" name="themeMode" value="dark" checked> <span id="darkLabel">Dark</span></label>
              </div>
              <div class="option-group">
                <strong id="languageLabel">Language:</strong>
                <label><input type="radio" name="languageMode" value="en" checked> English</label>
                <label><input type="radio" name="languageMode" value="ja"> 日本語</label>
              </div>
            </div>
            <div class="settings-bottom-row">
              <label><input id="saveSettings" type="checkbox" checked> <span id="saveSettingsLabel">Save settings</span></label>
              <label><input id="enableTimelineControl" type="checkbox"> <span id="timelineControlLabel">Enable timeline control</span></label>
            </div>
          </div>
        
      <div class="clear-settings-row">
        <button id="clearSavedSettingsBtn" class="clear-settings-btn" type="button" data-i18n="clearSavedSettings">Clear saved settings</button>
      </div>
</div>

        <div class="settings-group">
<div id="timeGroupHeading" class="settings-group-heading">Time</div>
          <div class="settings-group-body">
            <section class="settings time-settings">
              <div class="setting">
                <div id="presentationSettingLabel" class="setting-title">Presentation (min)</div>
                <div class="stepper">
                  <button type="button" data-target="presentation" data-delta="-1">−</button>
                  <input id="presentation" type="number" min="0" value="10">
                  <button type="button" data-target="presentation" data-delta="1">＋</button>
                </div>
              </div>
              <div class="setting">
                <div id="qaSettingLabel" class="setting-title">Q&amp;A (min)</div>
                <div class="stepper">
                  <button type="button" data-target="qa" data-delta="-1">−</button>
                  <input id="qa" type="number" min="0" value="5">
                  <button type="button" data-target="qa" data-delta="1">＋</button>
                </div>
              </div>
              <div class="setting">
                <div id="firstBellSettingLabel" class="setting-title">1st Bell (min from start)</div>
                <div class="stepper">
                  <button type="button" data-target="firstBell" data-delta="-1">−</button>
                  <input id="firstBell" type="number" min="0" value="9">
                  <button type="button" data-target="firstBell" data-delta="1">＋</button>
                </div>
              </div>
              <div class="setting">
                <div id="otAlertSettingLabel" class="setting-title">OT Alert (min after)</div>
                <div class="stepper">
                  <button type="button" data-target="overtimeAlert" data-delta="-1">−</button>
                  <input id="overtimeAlert" type="number" min="0" value="3">
                  <button type="button" data-target="overtimeAlert" data-delta="1">＋</button>
                </div>
              </div>
            </section>
          </div>
        </div>

        <div class="settings-group bell-group">
          <div id="bellGroupHeading" class="settings-group-heading">Bell Count</div>
          <div class="settings-group-body">
            <aside class="bell-sidebar" aria-label="Bell count settings">
              <div class="sound-toggle bell-counts">
                <strong id="bellCountLabel">Bell count:</strong>
                <label><span id="bellFirstLabel">1st</span> <input id="bellCountFirst" type="number" min="0" max="99" step="1" value="1" inputmode="numeric"></label>
                <label><span id="bellQALabel">Q&amp;A</span> <input id="bellCountQA" type="number" min="0" max="99" step="1" value="2" inputmode="numeric"></label>
                <label><span id="bellOverLabel">Overtime</span> <input id="bellCountOver" type="number" min="0" max="99" step="1" value="3" inputmode="numeric"></label>
                <label><span id="bellOTAlertLabel">OT Alert</span> <input id="bellCountOverAlert" type="number" min="0" max="99" step="1" value="4" inputmode="numeric"></label>
                <label><span id="bellManualLabel">Manual</span> <input id="manualBellCount" type="number" min="1" step="1" value="4" inputmode="numeric"></label>
              </div>
            </aside>
          </div>
        </div>
      </div>
    </div>
  </div>
<main class="timer-area">
    <div class="time-layout">
      <div class="primary-panel">
        <div id="timerTitle" class="timer-title">Remaining Time</div>
        <div id="timeDisplay" class="time">10:00</div>
      </div>
      <div id="secondaryPanel" class="secondary-panel">
        <div id="secondaryLabel" class="secondary-label">Elapsed</div>
        <div id="secondaryDisplay" class="secondary-display">00:00</div>
      </div>
    </div>

    <div class="timeline-wrap" aria-label="Presentation timeline">
      <div class="timeline-labels">
        <span id="startLabel" class="timeline-label start">0</span>
        <span id="qaBoundaryLabel" class="timeline-label">10 min</span>
        <span id="endLabel" class="timeline-label end">15 min</span>
      </div>
      <div id="timelineBar" class="timeline-bar">
        <div id="presentationSegment" class="timeline-presentation"></div>
        <div id="qaSegment" class="timeline-qa"></div>
        <div id="timelineProgress" class="timeline-progress"></div>
        <div id="firstBellTick" class="timeline-bell" aria-label="First bell marker"></div>
        <div id="qaInsideLabel" class="timeline-qa-inside">Q&amp;A</div>
        <div id="timelineMarker" class="timeline-marker"></div>
      </div>
      <div class="timeline-phase">
        <span id="presentationLabel">Presentation</span>
        <span id="qaLabel" class="inactive">Q&amp;A</span>
      </div>
    </div>

    <div class="controls-wrap">
      <div class="controls">
        <button id="startBtn" type="button">Start</button>
        <button id="resetBtn" type="button">Reset</button>
        <button id="fullscreenBtn" type="button">Fullscreen</button>
      </div>
      <button id="manualBellBtn" class="manual-ring-btn" type="button">Ring</button>
    </div>
  </main>

  <div id="footerLabel" class="footer">Offline Presentation Timer</div>
</div>

<script>
(() => {
  const presentationInput = document.getElementById('presentation');
  const qaInput = document.getElementById('qa');
  const firstBellInput = document.getElementById('firstBell');
  const overtimeAlertInput = document.getElementById('overtimeAlert');
  const timeDisplay = document.getElementById('timeDisplay');
  const timerTitle = document.getElementById('timerTitle');
  const secondaryLabel = document.getElementById('secondaryLabel');
  const secondaryDisplay = document.getElementById('secondaryDisplay');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const clearSavedSettingsBtn = document.getElementById('clearSavedSettingsBtn');
  const presentationLabel = document.getElementById('presentationLabel');
  const qaLabel = document.getElementById('qaLabel');
  const startLabel = document.getElementById('startLabel');
  const qaBoundaryLabel = document.getElementById('qaBoundaryLabel');
  const endLabel = document.getElementById('endLabel');
  const qaInsideLabel = document.getElementById('qaInsideLabel');
  const presentationSegment = document.getElementById('presentationSegment');
  const qaSegment = document.getElementById('qaSegment');
  const timelineProgress = document.getElementById('timelineProgress');
  const timelineMarker = document.getElementById('timelineMarker');
  const timelineBar = document.getElementById('timelineBar');
  const enableTimelineControl = document.getElementById('enableTimelineControl');
  const firstBellTick = document.getElementById('firstBellTick');
  const countModeInputs = document.querySelectorAll('input[name="countMode"]');
  const themeModeInputs = document.querySelectorAll('input[name="themeMode"]');
  const languageModeInputs = document.querySelectorAll('input[name="languageMode"]');
  const settingsShell = document.getElementById('settingsShell');
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  const saveSettingsCheckbox = document.getElementById('saveSettings');

  const manualBellBtn = document.getElementById('manualBellBtn');
  const manualBellCountInput = document.getElementById('manualBellCount');
  const bellCountFirstInput = document.getElementById('bellCountFirst');
  const bellCountQAInput = document.getElementById('bellCountQA');
  const bellCountOverInput = document.getElementById('bellCountOver');
  const bellCountOverAlertInput = document.getElementById('bellCountOverAlert');
  const soundModeInputs = document.querySelectorAll('input[name="soundMode"]');

  let running = false;
  let elapsedBeforeStart = 0;
  let startedAt = null;
  let timerHandle = null;
  let fired = new Set();
  let audioCtx = null;
  let draggingTimeline = false;
  let wakeLock = null;


  let language = 'en';

  const i18n = {
    en: {
      settings: 'Settings', basic: 'Basic', time: 'Time', bellCountHeading: 'Bell Count',
      count: 'Count:', down: 'Down', up: 'Up', theme: 'Theme:', light: 'Light', dark: 'Dark', language: 'Language:',
      save: 'Save settings', timelineControl: 'Enable timeline control',
      presentationMin: 'Presentation (min)', qaMin: 'Q&A (min)', firstBellMin: '1st Bell (min from start)', otAlertMin: 'OT Alert (min after)',
      bellCount: 'Bell count:', first: '1st', qa: 'Q&A', overtime: 'Overtime', otAlert: 'OT Alert', manual: 'Manual',
      remainingTime: 'Remaining Time', presentationTime: 'Presentation Time', remaining: 'Remaining', elapsed: 'Elapsed',
      qaTime: 'Q&A Time', qaRemaining: 'Q&A Remaining', totalElapsed: 'Total Elapsed', presentation: 'Presentation',
      start: 'Start', pause: 'Pause', reset: 'Reset', fullscreen: 'Fullscreen', exitFullscreen: 'Exit Fullscreen', ring: 'Ring',
      clearSavedSettings: 'Clear saved settings',
      footer: 'Offline Presentation Timer', min: 'min'
    },
    ja: {
      settings: '設定', basic: '基本', time: '時間', bellCountHeading: 'ベル回数',
      count: '表示:', down: '残り時間', up: '経過時間', theme: 'テーマ:', light: 'ライト', dark: 'ダーク', language: '言語:',
      save: '設定を保存', timelineControl: 'タイムライン操作を有効化',
      presentationMin: '発表時間（分）', qaMin: '質疑応答（分）', firstBellMin: '1stベル（開始から・分）', otAlertMin: '超過警告（超過後・分）',
      bellCount: 'ベル回数:', first: '1st', qa: '質疑', overtime: '時間超過', otAlert: '超過警告', manual: '手動',
      remainingTime: '残り時間', presentationTime: '発表経過時間', remaining: '残り', elapsed: '経過',
      qaTime: '質疑応答時間', qaRemaining: '質疑応答 残り', totalElapsed: '総経過時間', presentation: '発表',
      start: '開始', pause: '一時停止', reset: 'リセット', fullscreen: '全画面', exitFullscreen: '全画面を終了', ring: 'ベルを鳴らす',
      footer: 'オフライン発表タイマー', min: '分'
    }
  };

  function t(key) { return i18n[language][key] ?? i18n.en[key] ?? key; }

  function applyLanguage(lang) {
    language = lang === 'ja' ? 'ja' : 'en';
    document.documentElement.lang = language === 'ja' ? 'ja' : 'en';
    document.title = language === 'ja' ? '発表タイマー' : 'Presentation Timer';
    const text = (id, key) => { const el = document.getElementById(id); if (el) el.textContent = t(key); };
    text('settingsToggle', 'settings');
    const heads = document.querySelectorAll('.settings-group-heading');
    if (heads[0]) heads[0].textContent = t('basic');
    text('timeGroupHeading', 'time');
    text('bellGroupHeading', 'bellCountHeading');
    text('countLabel', 'count'); text('countDownLabel', 'down'); text('countUpLabel', 'up');
    text('themeLabel', 'theme'); text('lightLabel', 'light'); text('darkLabel', 'dark'); text('languageLabel', 'language');
    text('saveSettingsLabel', 'save'); text('timelineControlLabel', 'timelineControl');
    text('presentationSettingLabel', 'presentationMin'); text('qaSettingLabel', 'qaMin');
    text('firstBellSettingLabel', 'firstBellMin'); text('otAlertSettingLabel', 'otAlertMin');
    text('bellCountLabel', 'bellCount'); text('bellFirstLabel', 'first'); text('bellQALabel', 'qa');
    text('bellOverLabel', 'overtime'); text('bellOTAlertLabel', 'otAlert'); text('bellManualLabel', 'manual');
    text('qaInsideLabel', 'qa'); text('presentationLabel', 'presentation'); text('qaLabel', 'qa');
    text('resetBtn', 'reset'); text('manualBellBtn', 'ring'); text('footerLabel', 'footer');
    fullscreenBtn.textContent = document.fullscreenElement ? t('exitFullscreen') : t('fullscreen');
    startBtn.textContent = running ? t('pause') : t('start');
    update();
    persistSettings();
  }

  function setSettingsOpen(open) {
    settingsShell.classList.toggle('open', open);
    settingsToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  async function requestWakeLock() {
    if (!('wakeLock' in navigator) || !running || document.visibilityState !== 'visible') return;
    try {
      if (!wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (_) {}
  }

  async function releaseWakeLock() {
    if (!wakeLock) return;
    try { await wakeLock.release(); } catch (_) {}
    wakeLock = null;
  }

  const SETTINGS_KEY = 'presentationTimerSettingsV29';

  function collectSettings() {
    return {
      presentation: value(presentationInput),
      qa: value(qaInput),
      firstBell: value(firstBellInput),
      overtimeAlert: value(overtimeAlertInput),
      bellCountFirst: getBellCount(bellCountFirstInput),
      bellCountQA: getBellCount(bellCountQAInput),
      bellCountOver: getBellCount(bellCountOverInput),
      bellCountOverAlert: getBellCount(bellCountOverAlertInput),
      countMode: getCountMode(),
      language,
      manualBellCount: getManualBellCount()
    };
  }

  function persistSettings() {
    try {
      localStorage.setItem('presentationTimerSaveSettings', saveSettingsCheckbox.checked ? '1' : '0');
      if (saveSettingsCheckbox.checked) localStorage.setItem(SETTINGS_KEY, JSON.stringify(collectSettings()));
      else localStorage.removeItem(SETTINGS_KEY);
    } catch (_) {}
  }

  function restoreSettings() {
    try {
      const savedPreference = localStorage.getItem('presentationTimerSaveSettings');
      saveSettingsCheckbox.checked = savedPreference !== '0';
      if (!saveSettingsCheckbox.checked) return;
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return;
      const st = JSON.parse(raw);
      if (Number.isFinite(st.presentation)) presentationInput.value = st.presentation;
      if (Number.isFinite(st.qa)) qaInput.value = st.qa;
      if (Number.isFinite(st.firstBell)) firstBellInput.value = st.firstBell;
      if (Number.isFinite(st.overtimeAlert)) overtimeAlertInput.value = st.overtimeAlert;
      if (Number.isFinite(st.bellCountFirst)) bellCountFirstInput.value = clampBellCount(st.bellCountFirst);
      else if (typeof st.soundFirst === 'boolean') bellCountFirstInput.value = st.soundFirst ? 1 : 0;
      if (Number.isFinite(st.bellCountQA)) bellCountQAInput.value = clampBellCount(st.bellCountQA);
      else if (typeof st.soundQA === 'boolean') bellCountQAInput.value = st.soundQA ? 2 : 0;
      if (Number.isFinite(st.bellCountOver)) bellCountOverInput.value = clampBellCount(st.bellCountOver);
      else if (typeof st.soundOver === 'boolean') bellCountOverInput.value = st.soundOver ? 3 : 0;
      if (Number.isFinite(st.bellCountOverAlert)) bellCountOverAlertInput.value = clampBellCount(st.bellCountOverAlert);
      else if (typeof st.soundOverAlert === 'boolean') bellCountOverAlertInput.value = st.soundOverAlert ? 4 : 0;
      if (st.countMode === 'down' || st.countMode === 'up') {
        const r = document.querySelector(`input[name="countMode"][value="${st.countMode}"]`);
        if (r) r.checked = true;
      }
      if (st.language === 'en' || st.language === 'ja') {
        const lr = document.querySelector(`input[name="languageMode"][value="${st.language}"]`);
        if (lr) lr.checked = true;
        language = st.language;
      }
      if (Number.isFinite(st.manualBellCount)) manualBellCountInput.value = Math.max(1, Math.min(99, Math.floor(st.manualBellCount)));
    } catch (_) {}
  }


  function applyTheme(theme) {
    document.body.classList.toggle('dark', theme === 'dark');
    try { localStorage.setItem('presentationTimerTheme', theme); } catch (_) {}
  }

  try {
    const savedTheme = localStorage.getItem('presentationTimerTheme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      const radio = document.querySelector(`input[name="themeMode"][value="${savedTheme}"]`);
      if (radio) radio.checked = true;
      applyTheme(savedTheme);
    } else {
      applyTheme('dark');
    }
  } catch (_) {
    applyTheme('dark');
  }

  function value(el) {
    return Math.max(0, Number(el.value) || 0);
  }

  function getElapsed() {
    return elapsedBeforeStart + (running ? (performance.now() - startedAt) / 1000 : 0);
  }

  function formatTime(seconds) {
    const s = Math.max(0, Math.floor(seconds));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  async function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state !== 'running') {
      try { await audioCtx.resume(); } catch (_) {}
    }
    return audioCtx.state === 'running';
  }

  // Synthesized metal bell — no MP3/WAV required.
  // Several slightly inharmonic sine partials with different decay times
  // create a short "ding" followed by a natural metallic ring.
  function bellStrike(start) {
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0.0001, start);
    master.gain.exponentialRampToValueAtTime(0.62, start + 0.004);
    master.gain.exponentialRampToValueAtTime(0.0001, start + 1.65);
    master.connect(audioCtx.destination);

    const partials = [
      { f: 740,  g: 0.24, d: 1.55 },
      { f: 1112, g: 0.17, d: 1.18 },
      { f: 1493, g: 0.12, d: 0.92 },
      { f: 2058, g: 0.08, d: 0.66 },
      { f: 2785, g: 0.045, d: 0.42 }
    ];

    partials.forEach(({ f, g, d }) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(g, start + 0.003);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + d);
      osc.connect(gain).connect(master);
      osc.start(start);
      osc.stop(start + d + 0.04);
    });

    // Very short high-frequency attack to mimic the bell's striker.
    const click = audioCtx.createOscillator();
    const clickGain = audioCtx.createGain();
    click.type = 'triangle';
    click.frequency.setValueAtTime(3300, start);
    clickGain.gain.setValueAtTime(0.11, start);
    clickGain.gain.exponentialRampToValueAtTime(0.0001, start + 0.045);
    click.connect(clickGain).connect(master);
    click.start(start);
    click.stop(start + 0.055);
  }

  async function ring(times) {
    const ready = await ensureAudio();
    if (!ready || times <= 0) return;
    const base = audioCtx.currentTime + 0.04;
    // All repeated bells use a fixed 4 Hz cadence (0.25 s between strikes).
    const interval = 0.25;
    for (let i = 0; i < times; i++) bellStrike(base + i * interval);
  }

  function getCountMode() {
    return document.querySelector('input[name="countMode"]:checked').value;
  }

  function setPhaseState(inPresentation, inQA, qaExists) {
    presentationLabel.classList.toggle('inactive', !inPresentation);
    qaLabel.classList.toggle('inactive', !inQA);
    if (!qaExists) {
      presentationLabel.classList.remove('inactive');
      qaLabel.classList.add('inactive');
    }
  }

  function update() {
    const elapsed = getElapsed();
    const mode = getCountMode();
    const p = value(presentationInput) * 60;
    const q = value(qaInput) * 60;
    const b1 = value(firstBellInput) * 60;
    const overAlertDelay = value(overtimeAlertInput) * 60;
    const total = p + q;
    const overAlertAt = total + overAlertDelay;

    const qaPct = total > 0 ? (p / total) * 100 : 100;
    const qaMidPct = total > 0 && q > 0 ? (p + q / 2) / total * 100 : 100;
    const progressPct = total > 0 ? Math.min(100, Math.max(0, elapsed / total * 100)) : 0;
    presentationSegment.style.width = `${qaPct}%`;
    qaSegment.style.width = `${Math.max(0, 100 - qaPct)}%`;
    startLabel.textContent = '0';
    qaBoundaryLabel.textContent = `${Math.round(p / 60)} ${t('min')}`;
    endLabel.textContent = `${Math.round(total / 60)} ${t('min')}`;
    qaBoundaryLabel.style.left = `${qaPct}%`;
    qaBoundaryLabel.style.display = q > 0 ? 'block' : 'none';
    qaInsideLabel.style.left = `${qaMidPct}%`;
    qaInsideLabel.style.display = q > 0 ? 'block' : 'none';
    timelineProgress.style.width = `${progressPct}%`;
    timelineMarker.style.left = `${progressPct}%`;
    const bellPct = total > 0 ? Math.min(100, Math.max(0, b1 / total * 100)) : 0;
    firstBellTick.style.left = `${bellPct}%`;
    const showBell = b1 > 0 && b1 < total;
    firstBellTick.style.display = showBell ? 'block' : 'none';

    timerTitle.classList.remove('qa-title', 'overtime');
    timeDisplay.classList.remove('overtime');
    secondaryDisplay.classList.remove('overtime');
    timeDisplay.classList.remove('ending-soon');

    // Visual warning during the final 5 seconds before the presentation ends
    // and during the final 5 seconds before the overall scheduled end.
    const presentationEndingSoon = p > 0 && q > 0 && elapsed >= Math.max(0, p - 5) && elapsed < p;
    const overallEndingSoon = total > 0 && elapsed >= Math.max(0, total - 5) && elapsed < total;
    if (presentationEndingSoon || overallEndingSoon) {
      timeDisplay.classList.add('ending-soon');
    }

    if (elapsed < p || (p === 0 && elapsed === 0)) {
      setPhaseState(true, false, q > 0);
      if (mode === 'up') {
        timerTitle.textContent = t('presentationTime');
        secondaryLabel.textContent = t('remaining');
        timeDisplay.textContent = formatTime(elapsed);
        secondaryDisplay.textContent = formatTime(Math.max(0, p - elapsed));
      } else {
        timerTitle.textContent = t('remainingTime');
        secondaryLabel.textContent = t('elapsed');
        timeDisplay.textContent = formatTime(Math.max(0, p - elapsed));
        secondaryDisplay.textContent = formatTime(elapsed);
      }
    } else if (q > 0 && elapsed < total) {
      setPhaseState(false, true, true);
      timerTitle.classList.add('qa-title');
      if (mode === 'up') {
        timerTitle.textContent = t('qaTime');
        secondaryLabel.textContent = t('remaining');
        timeDisplay.textContent = formatTime(elapsed - p);
        secondaryDisplay.textContent = formatTime(Math.max(0, total - elapsed));
      } else {
        timerTitle.textContent = t('qaRemaining');
        secondaryLabel.textContent = t('elapsed');
        timeDisplay.textContent = formatTime(Math.max(0, total - elapsed));
        secondaryDisplay.textContent = formatTime(elapsed - p);
      }
    } else {
      setPhaseState(q <= 0, q > 0, q > 0);
      timerTitle.textContent = t('overtime');
      timerTitle.classList.add('overtime');
      const over = Math.max(0, elapsed - total);
      timeDisplay.textContent = (mode === 'down' ? '-' : '+') + formatTime(over);
      timeDisplay.classList.add('overtime');
      secondaryLabel.textContent = t('totalElapsed');
      secondaryDisplay.textContent = formatTime(elapsed);
    }

    if (running && b1 > 0 && elapsed >= b1 && !fired.has('b1')) {
      fired.add('b1');
      const n = getBellCount(bellCountFirstInput);
      if (n > 0) ring(n);
    }

    if (running && q > 0 && elapsed >= p && !fired.has('qa')) {
      fired.add('qa');
      const n = getBellCount(bellCountQAInput);
      if (n > 0) ring(n);
    }

    if (running && elapsed >= total && total > 0 && !fired.has('over')) {
      fired.add('over');
      const n = getBellCount(bellCountOverInput);
      if (n > 0) ring(n);
    }

    if (running && overAlertDelay > 0 && elapsed >= overAlertAt && total > 0 && !fired.has('overAlert')) {
      fired.add('overAlert');
      const n = getBellCount(bellCountOverAlertInput);
      if (n > 0) ring(n);
    }
  }

  function syncFiredForElapsed(elapsed) {
    const p = value(presentationInput) * 60;
    const q = value(qaInput) * 60;
    const b1 = value(firstBellInput) * 60;
    const overAlertDelay = value(overtimeAlertInput) * 60;
    const total = p + q;
    fired.clear();
    if (b1 > 0 && elapsed >= b1) fired.add('b1');
    if (q > 0 && elapsed >= p) fired.add('qa');
    if (total > 0 && elapsed >= total) fired.add('over');
    if (total > 0 && overAlertDelay > 0 && elapsed >= total + overAlertDelay) fired.add('overAlert');
  }

  function seekTimelineFromClientX(clientX) {
    if (!enableTimelineControl.checked) return;
    const p = value(presentationInput) * 60;
    const q = value(qaInput) * 60;
    const total = p + q;
    if (total <= 0) return;

    const rect = timelineBar.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    const newElapsed = ratio * total;

    elapsedBeforeStart = newElapsed;
    if (running) startedAt = performance.now();
    syncFiredForElapsed(newElapsed);
    update();
  }

  function setTimelineEditable(enabled) {
    timelineBar.classList.toggle('timeline-editable', enabled);
    timelineMarker.setAttribute('aria-disabled', String(!enabled));
  }

  function loop() {
    update();
    if (running) timerHandle = requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', async () => {
    // Resume/prime Web Audio directly from the user's Start click so the
    // first automatic bell is not lost to browser autoplay restrictions.
    await ensureAudio();
    if (!running) {
      running = true;
      startedAt = performance.now();
      startBtn.textContent = t('pause');
      requestWakeLock();
      loop();
    } else {
      elapsedBeforeStart = getElapsed();
      running = false;
      startedAt = null;
      cancelAnimationFrame(timerHandle);
      startBtn.textContent = t('start');
      releaseWakeLock();
      update();
    }
  });

  resetBtn.addEventListener('click', () => {
    running = false;
    elapsedBeforeStart = 0;
    startedAt = null;
    fired.clear();
    cancelAnimationFrame(timerHandle);
    startBtn.textContent = t('start');
    releaseWakeLock();
  
  if (clearSavedSettingsBtn) {
    clearSavedSettingsBtn.addEventListener('click', () => {
      try {
        localStorage.removeItem('presentationTimerSettingsV28');
        localStorage.removeItem('presentationTimerSettingsV29');
      } catch (_) {}

      presentationInput.value = 10;
      qaInput.value = 5;
      firstBellInput.value = 9;
      if (typeof otAlertInput !== 'undefined' && otAlertInput) otAlertInput.value = 3;

      const enRadio = document.querySelector('input[name="languageMode"][value="en"]');
      if (enRadio) enRadio.checked = true;

      const darkRadio = document.querySelector('input[name="themeMode"][value="dark"]');
      if (darkRadio) darkRadio.checked = true;
      if (typeof applyTheme === 'function') applyTheme('dark');

      if (typeof applyLanguage === 'function') applyLanguage('en');
      else if (typeof updateLanguage === 'function') updateLanguage('en');

      if (typeof saveSettingsInput !== 'undefined' && saveSettingsInput) saveSettingsInput.checked = true;

      elapsedBeforeStart = 0;
      startedAt = null;
      running = false;
      fired.clear();
      if (timerHandle) cancelAnimationFrame(timerHandle);
      startBtn.textContent = 'Start';
      update();
    });
  }

  update();
  });

  document.querySelectorAll('[data-target]').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      input.value = Math.max(0, value(input) + Number(btn.dataset.delta));
      syncBellCountsToTimes(input);
      if (!running && elapsedBeforeStart === 0) update();
      persistSettings();
    });
  });

  [presentationInput, qaInput, firstBellInput, overtimeAlertInput].forEach(input => {
    input.addEventListener('input', () => {
      syncBellCountsToTimes(input);
      if (!running) update();
      persistSettings();
    });
  });

  countModeInputs.forEach(input => input.addEventListener('change', () => { update(); persistSettings(); }));
  themeModeInputs.forEach(input => input.addEventListener('change', () => { applyTheme(input.value); persistSettings(); }));
  languageModeInputs.forEach(input => input.addEventListener('change', () => applyLanguage(input.value)));
  soundModeInputs.forEach(input => input.addEventListener('change', () => {
    if (input.checked && input.value === 'on') ensureAudio();
  }));
  [bellCountFirstInput, bellCountQAInput, bellCountOverInput, bellCountOverAlertInput].forEach(input => {
    input.addEventListener('input', () => { sanitizeBellCountInput(input); persistSettings(); });
    input.addEventListener('change', () => { sanitizeBellCountInput(input); persistSettings(); });
  });
  manualBellCountInput.addEventListener('change', persistSettings);
  manualBellCountInput.addEventListener('input', persistSettings);
  saveSettingsCheckbox.addEventListener('change', persistSettings);

  enableTimelineControl.addEventListener('change', () => {
    setTimelineEditable(enableTimelineControl.checked);
    draggingTimeline = false;
  });

  timelineBar.addEventListener('pointerdown', (e) => {
    if (!enableTimelineControl.checked) return;
    draggingTimeline = true;
    if (timelineBar.setPointerCapture) timelineBar.setPointerCapture(e.pointerId);
    seekTimelineFromClientX(e.clientX);
    e.preventDefault();
  });

  timelineBar.addEventListener('pointermove', (e) => {
    if (!draggingTimeline || !enableTimelineControl.checked) return;
    seekTimelineFromClientX(e.clientX);
    e.preventDefault();
  });

  const stopTimelineDrag = (e) => {
    if (!draggingTimeline) return;
    draggingTimeline = false;
    if (e && timelineBar.releasePointerCapture && timelineBar.hasPointerCapture?.(e.pointerId)) {
      timelineBar.releasePointerCapture(e.pointerId);
    }
  };
  timelineBar.addEventListener('pointerup', stopTimelineDrag);
  timelineBar.addEventListener('pointercancel', stopTimelineDrag);


  function clampBellCount(n) {
    n = Math.floor(Number(n));
    return Number.isFinite(n) ? Math.max(0, Math.min(99, n)) : 0;
  }

  function getBellCount(input) {
    return clampBellCount(input.value);
  }

  function sanitizeBellCountInput(input) {
    input.value = getBellCount(input);
  }

  function syncBellCountsToTimes(sourceInput = null) {
    // Empty input means "still editing": never change a bell count.
    // Only an explicitly entered numeric zero temporarily sets the directly
    // corresponding automatic bell count to 0. Entering a positive time later
    // does not restore the bell count automatically; the user stays in control.
    if (!sourceInput) return;
    const raw = String(sourceInput.value ?? '').trim();
    if (raw === '') return;
    const n = Number(raw);
    if (!Number.isFinite(n) || n !== 0) return;

    if (sourceInput === qaInput) bellCountQAInput.value = 0;
    else if (sourceInput === firstBellInput) bellCountFirstInput.value = 0;
    else if (sourceInput === overtimeAlertInput) bellCountOverAlertInput.value = 0;
  }

  function getManualBellCount() {
    const n = Math.floor(Number(manualBellCountInput.value));
    const count = Number.isFinite(n) ? Math.max(1, Math.min(99, n)) : 4;
    manualBellCountInput.value = count;
    return count;
  }

  manualBellBtn.addEventListener('click', () => {
    ensureAudio();
    ring(getManualBellCount());
  });

  settingsToggle.addEventListener('click', () => {
    setSettingsOpen(!settingsShell.classList.contains('open'));
  });



  fullscreenBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {}
  });

  document.addEventListener('fullscreenchange', () => {
    document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
    fullscreenBtn.textContent = document.fullscreenElement ? t('exitFullscreen') : t('fullscreen');
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) requestWakeLock();
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !['INPUT','BUTTON'].includes(document.activeElement.tagName)) {
      e.preventDefault(); startBtn.click();
    }
    if (e.key.toLowerCase() === 'r' && document.activeElement.tagName !== 'INPUT') resetBtn.click();
    if (e.key.toLowerCase() === 'f' && document.activeElement.tagName !== 'INPUT') fullscreenBtn.click();
  });

  restoreSettings();
  const initialLanguageRadio = document.querySelector('input[name="languageMode"]:checked');
  language = initialLanguageRadio ? initialLanguageRadio.value : 'en';
  syncBellCountsToTimes();
  setTimelineEditable(false);
  setSettingsOpen(false);
  applyLanguage(language);
})();
</script>
</body>
</html>
